# ---------------------------------------------------------------------------
# Gradle
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true

# ---------------------------------------------------------------------------
# JDK
#
# 本项目要求 Java 21（NeoForge 1.21.1 / ModDevGradle 的硬性要求）。
# 这里刻意不写死任何本机路径 —— 写死会让别人 clone 下来直接构建失败。
# 任选一种方式让 Gradle 找到 JDK 21：
#   1) 设置环境变量 JAVA_HOME 指向 JDK 21；
#   2) 或者在你自己的 ~/.gradle/gradle.properties 里加一行
#        org.gradle.java.home=/absolute/path/to/jdk-21
#      （该文件在用户目录下，不会被提交到仓库）
#
# 注意：org.gradle.java.home 必须指向 JDK 21，而不只是"编译器用的工具链"——
# ModDevGradle 要求 Gradle 守护进程本身跑在 17+，否则 apply 插件时会直接报
# "please run Gradle with Java 17 or newer"。只设 installations.paths 是不够的。
#
# 如果你的 JDK 不在 Gradle 能自动探测到的位置，也可以临时指定：
#   org.gradle.java.installations.paths=/absolute/path/to/jdk-21
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Minecraft / NeoForge
# ---------------------------------------------------------------------------
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.259
neo_version_range=[21.1,)
loader_version_range=[4,)

# ---------------------------------------------------------------------------
# Mod metadata
# NOTE: gradle.properties is read as ISO-8859-1 by the JVM, so keep every value
#       here ASCII-only. The Chinese mod description lives in neoforge.mods.toml.
# ---------------------------------------------------------------------------
mod_id=itemchat
mod_name=ItemChat
mod_license=GPL-3.0
# 注意：本号是 NeoForge 1.21.1 这条线自己的版本序列，与 Forge 1.20.1 线
# （itemchat-forge）的版本号互相独立、不跟随。两条线后续各自更新。
mod_version=1.2.2
mod_group_id=com.example.itemchat
mod_authors=Abslt_

# ---------------------------------------------------------------------------
# Optional dependency: JEI (compile-only API + runtime for the dev client)
# JEI 19.x is the 1.21.1 line; 15.x was the 1.20.1 line.
# ---------------------------------------------------------------------------
jei_version=19.25.1.332

# ---------------------------------------------------------------------------
# Optional dependency: FTB Quests 全家桶（NeoForge 1.21.1 线，版本号即 MC 1.21.1）
#
# 这里刻意 pin 得和测试实例「FTB OceanBlock 2」里实际装的版本一致，
# 这样开发环境与实机运行时看到的 API 完全相同。
# 注意：1.20.1 线（2001.x）还需要 item-filters，1.21.1 线（2101.x）已经不需要了。
# ---------------------------------------------------------------------------
ftb_quests_version=2101.1.33
ftb_library_version=2101.1.35
ftb_teams_version=2101.1.10
architectury_version=13.0.11
