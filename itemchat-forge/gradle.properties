# ---------------------------------------------------------------------------
# Gradle
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true

# ---------------------------------------------------------------------------
# 网络：Gradle 的 JVM 不会自动使用 Windows 系统代理。
# 早先这里写死了 127.0.0.1:7897（梯子端口），但梯子一关反而会让构建连不上仓库，
# 所以改成「跟随系统代理开关」——开了梯子就走代理，关了就走直连。
# ---------------------------------------------------------------------------
systemProp.java.net.useSystemProxies=true
#
# 如果上面这招在你的环境不生效（构建报 "Plugin ... was not found" 或依赖下载超时），
# 就改用显式代理：取消下面四行注释，并把端口改成你梯子的端口。
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=7897
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=7897

# ---------------------------------------------------------------------------
# JDK
#
# 本项目要求 Java 17（Forge 1.20.1 / ForgeGradle 6 的硬性要求）。
# 这里刻意不写死任何本机路径 —— 写死会让别人 clone 下来直接构建失败。
# 任选一种方式让 Gradle 找到 JDK 17：
#   1) 设置环境变量 JAVA_HOME 指向 JDK 17；
#   2) 或者在你自己的 ~/.gradle/gradle.properties 里加一行
#        org.gradle.java.home=/absolute/path/to/jdk-17
#      （该文件在用户目录下，不会被提交到仓库）
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Minecraft / Forge
# ---------------------------------------------------------------------------
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
# FTB Library 2001.2.13 的 mods.toml 里声明 forge 依赖为 [47.3,)，用 47.2.0 会被
# FML 拒绝加载（Missing or unsupported mandatory dependencies），所以这里不能低于 47.3。
forge_version=47.4.10
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

# ---------------------------------------------------------------------------
# Mod metadata
# ---------------------------------------------------------------------------
mod_id=itemchat
mod_name=ItemChat
mod_license=GPL-3.0
mod_version=1.3.0
mod_group_id=com.example.itemchat
mod_authors=Abslt_

# ---------------------------------------------------------------------------
# Soft dependencies (Forge 1.20.1 line)
#
# 全部从各自的官方 maven 拉取，仓库里不再 vendors 任何第三方 jar。
# 1.20.1 线的 FTB 是 2001.x。
# 注意：item-filters 不需要引入 —— FTB Quests 2001.4.22 把 itemfilters 声明为
#       mandatory=false，而本模组也没有引用它的任何类。
# ---------------------------------------------------------------------------
jei_version=15.49.0.188
ftb_quests_version=2001.4.22
ftb_library_version=2001.2.13
ftb_teams_version=2001.3.2
architectury_version=9.2.14
